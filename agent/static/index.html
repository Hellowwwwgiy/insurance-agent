<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保险 SQL 智能助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 760px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 92vh;
  }
  .header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 16px 24px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; opacity: .85; margin-top: 4px; }

  /* Metrics toggle */
  #metrics-toggle {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .2s;
  }
  #metrics-toggle:hover { background: rgba(255,255,255,.28); }
  #metrics-toggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* Metrics panel */
  .metrics {
    background: #f0f4ff;
    border-bottom: 1px solid #e4e7ed;
    padding: 0 24px;
    overflow: hidden;
    transition: max-height .35s ease, padding .25s ease;
    max-height: 0;
  }
  .metrics.open { max-height: 400px; padding: 14px 24px; }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .metric-card {
    background: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    border: 1px solid #e4e7ed;
  }
  .metric-card .label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 4px;
  }
  .metric-card .value {
    font-size: 20px;
    font-weight: 700;
    color: #333;
    font-variant-numeric: tabular-nums;
  }
  .metric-card .value.green { color: #2ba471; }
  .metric-card .value.orange { color: #d68500; }
  .metric-card .value.blue { color: #5b6bc1; }
  .route-bar {
    margin-top: 10px;
    background: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    border: 1px solid #e4e7ed;
  }
  .route-bar .label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .route-items { display: flex; flex-direction: column; gap: 6px; }
  .route-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }
  .route-item .route { min-width: 110px; color: #555; font-family: monospace; }
  .route-item .bar-wrap { flex: 1; height: 8px; background: #eef1f8; border-radius: 4px; overflow: hidden; }
  .route-item .bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width .4s; }
  .route-item .count { min-width: 40px; text-align: right; color: #333; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metrics-note {
    font-size: 11px;
    color: #999;
    margin-top: 8px;
    text-align: right;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f7f8fc;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #333; border: 1px solid #e4e7ed; border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e4e7ed; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #e8f7ee; color: #2ba471; }
  .badge.warn { background: #fff4e5; color: #d68500; }
  .badge.retry { background: #eef1ff; color: #5b6bc1; }
  .empty { text-align: center; color: #aaa; margin: auto; font-size: 14px; }

  .input-area {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #e4e7ed;
    background: #fff;
  }
  #newchat {
    width: 44px; flex-shrink: 0;
    background: #f0f2f8; color: #667eea;
    border: 1px solid #dcdfe6; border-radius: 10px;
    font-size: 20px; cursor: pointer;
  }
  #newchat:hover { background: #e6e9f5; }
  #question {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #dcdfe6;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    max-height: 120px;
  }
  #question:focus { border-color: #667eea; }
  #send {
    padding: 0 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); }
  #send:disabled { opacity: .5; cursor: not-allowed; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #aaa; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div>
        <h1>🛡️ 保险 SQL 智能助手</h1>
        <p>自然语言查询保险数据库 · 带事实校验</p>
      </div>
      <button id="metrics-toggle" onclick="toggleMetrics()">
        <span class="dot"></span>
        <span id="metrics-label">指标面板</span>
      </button>
    </div>
  </div>

  <div class="metrics" id="metrics-panel">
    <div class="metric-grid">
      <div class="metric-card">
        <div class="label">Total Req</div>
        <div class="value blue" id="m-total">0</div>
      </div>
      <div class="metric-card">
        <div class="label">5xx Errors</div>
        <div class="value green" id="m-5xx">0</div>
      </div>
      <div class="metric-card">
        <div class="label">P50 Latency</div>
        <div class="value" id="m-p50">0 ms</div>
      </div>
      <div class="metric-card">
        <div class="label">P95 Latency</div>
        <div class="value orange" id="m-p95">0 ms</div>
      </div>
    </div>
    <div class="route-bar">
      <div class="label">Request Routes</div>
      <div class="route-items" id="m-routes"></div>
    </div>
    <div class="metrics-note" id="m-updated">--</div>
  </div>

  <div class="messages" id="messages">
    <div class="empty">输入问题，例如：「张三的保费是多少？」</div>
  </div>

  <div class="input-area">
    <button id="newchat" onclick="newChat()" title="开启新会话">＋</button>
    <textarea id="question" rows="1" placeholder="请输入您的问题..." oninput="autoResize(this)"></textarea>
    <button id="send" onclick="sendQuery()">发送</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');
let sessionId = null;
let streaming = false;

// ============ Metrics ============
let metricsOn = false;
let metricsTimer = null;

function toggleMetrics() {
  const panel = document.getElementById('metrics-panel');
  const label = document.getElementById('metrics-label');
  metricsOn = !metricsOn;
  panel.classList.toggle('open', metricsOn);
  label.textContent = metricsOn ? 'Hide' : '指标面板';
  if (metricsOn) {
    fetchMetrics();
    metricsTimer = setInterval(fetchMetrics, 3000);
  } else {
    clearInterval(metricsTimer);
    metricsTimer = null;
  }
}

async function fetchMetrics() {
  try {
    const res = await fetch('/metrics', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    parseAndRenderMetrics(text);
  } catch (e) { /* silent */ }
}

function parseAndRenderMetrics(text) {
  const lines = text.trim().split('\n');
  const gauges = {};
  const counters = {};  // label -> value

  for (const raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;

    // pattern: metric_name{labels} value  OR  metric_name value
    const m = line.match(/^(\w+)(?:\{([^}]*)\})?\s+([\d.eE+-]+)/);
    if (!m) continue;
    const name = m[1];
    const labels = m[2] || '';
    const value = parseFloat(m[3]);

    if (labels) {
      // parse labels like route="GET /health"
      const labelObj = {};
      labels.split(',').forEach(kv => {
        const eq = kv.indexOf('=');
        if (eq > 0) labelObj[kv.slice(0,eq).trim()] = kv.slice(eq+1).replace(/^"|"$/g,'');
      });
      counters[name + '|' + JSON.stringify(labelObj)] = { labels: labelObj, value };
    } else {
      gauges[name] = value;
    }
  }

  // Render
  document.getElementById('m-total').textContent = Math.round(gauges.insurance_request_total || 0);
  const e5xx = Math.round(gauges.insurance_status_5xx_total || 0);
  const e5xxEl = document.getElementById('m-5xx');
  e5xxEl.textContent = e5xx;
  e5xxEl.className = 'value ' + (e5xx > 0 ? 'orange' : 'green');

  const p50 = gauges.insurance_latency_p50_ms || 0;
  const p95 = gauges.insurance_latency_p95_ms || 0;
  document.getElementById('m-p50').textContent = p50.toFixed(1) + ' ms';
  const p95El = document.getElementById('m-p95');
  p95El.textContent = p95.toFixed(1) + ' ms';
  p95El.className = 'value ' + (p95 > 5000 ? 'orange' : (p95 > 1000 ? '' : 'green'));

  // Routes
  const routes = Object.values(counters)
    .filter(c => c.labels.route)
    .sort((a, b) => b.value - a.value);
  const total = routes.reduce((s, r) => s + r.value, 0) || 1;
  const routesEl = document.getElementById('m-routes');
  routesEl.innerHTML = routes.map(r => `
    <div class="route-item">
      <span class="route">${escapeHtml(r.labels.route)}</span>
      <div class="bar-wrap"><div class="bar" style="width:${(r.value/total*100).toFixed(0)}%"></div></div>
      <span class="count">${r.value}</span>
    </div>
  `).join('');

  const now = new Date();
  document.getElementById('m-updated').textContent = 'Updated ' + now.toLocaleTimeString();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ Chat ============
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function clearEmpty() {
  const empty = messagesEl.querySelector('.empty');
  if (empty) empty.remove();
}
function addUser(text) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollBottom();
}
function createBotMsg() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const content = document.createElement('span');
  content.className = 'content';
  content.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  div.appendChild(content);
  messagesEl.appendChild(div);
  return { div, content };
}
function finalizeBot(div, { verified, attempts, error }) {
  if (error || !attempts) { scrollBottom(); return; }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const v = document.createElement('span');
  v.className = 'badge ' + (verified ? 'ok' : 'warn');
  v.textContent = verified ? '✓ 事实校验通过' : '⚠ 未经事实校验';
  const a = document.createElement('span');
  a.className = 'badge retry';
  a.textContent = `重试 ${attempts} 次`;
  meta.appendChild(v); meta.appendChild(a);
  div.appendChild(meta);
  scrollBottom();
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function setLoading(loading) {
  streaming = loading;
  sendBtn.disabled = loading;
  sendBtn.textContent = loading ? '思考中...' : '发送';
}
function newChat() {
  if (streaming) return;
  sessionId = null;
  messagesEl.innerHTML = '<div class="empty">输入问题，例如：「张三的保费是多少？」</div>';
  input.focus();
}
async function sendQuery() {
  const q = input.value.trim();
  if (!q || streaming) return;
  addUser(q);
  input.value = '';
  input.style.height = 'auto';
  setLoading(true);
  const { div, content } = createBotMsg();
  let cleared = false;
  let finalMeta = { verified: false, attempts: 0 };
  try {
    const res = await fetch('/query/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: sessionId })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        const ev = JSON.parse(payload);
        if (ev.type === 'token') {
          if (!cleared) { content.textContent = ''; cleared = true; }
          content.textContent += ev.content;
          scrollBottom();
        } else if (ev.type === 'retry') {
          if (!cleared) { content.textContent = ''; cleared = true; }
          content.textContent += '\n\n🔄 检测到数据偏差，正在重新生成...\n\n';
          scrollBottom();
        } else if (ev.type === 'done') {
          finalMeta = { verified: ev.verified, attempts: ev.attempts, error: false };
          fetchMetrics(); // refresh metrics right after query
        } else if (ev.type === 'error') {
          if (!cleared) { content.textContent = ''; cleared = true; }
          content.textContent += '\n\n❌ ' + ev.message;
        } else if (ev.type === 'session') {
          sessionId = ev.session_id;
        }
      }
    }
    if (!cleared) content.textContent = '(无响应内容)';
    finalizeBot(div, finalMeta);
  } catch (e) {
    if (!cleared) content.textContent = '';
    content.textContent += '❌ 查询失败：' + e.message;
    finalizeBot(div, { verified: false, attempts: 0, error: true });
  } finally {
    setLoading(false);
    input.focus();
  }
}
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
});
input.focus();
</script>
</body>
</html>
